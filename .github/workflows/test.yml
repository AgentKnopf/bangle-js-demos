name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  emulator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: .cache/emulator
          key: bangle-emulator-${{ hashFiles('tools/lib/fetch-emulator.js') }}
      - run: npm run fetch-emulator
      - run: npm run test:harness
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output
          path: build/
          if-no-files-found: ignore
